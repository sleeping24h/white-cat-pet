name: rename-to-index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "sleeping24h"
          git config user.email "sleeping24h@users.noreply.github.com"
          git mv hei-mao-jian-pan-chong-wu.html index.html
          git commit -m "Rename to index.html"
          git push
